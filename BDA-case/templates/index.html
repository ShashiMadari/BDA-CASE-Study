<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction System</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #e3f2fd, #ffffff);
        }

        .container {
            width: 650px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
        }

        h2, h3 {
            text-align: center;
            color: #0d47a1;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        hr {
            margin: 25px 0;
        }

        .dashboard-btn {
            background: #2e7d32;
        }

        .dashboard-btn:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<div class="container">

<h2>❤️ Heart Disease Prediction System</h2>

<!-- ================= Prediction Form ================= -->
<form action="/predict" method="post">

    <label>Patient Name</label>
    <input type="text" name="name" placeholder="Enter patient name" required>

    <label>Age (1–120)</label>
    <input type="number" name="age" min="1" max="120" required>

    <label>Sex</label>
    <select name="sex" required>
        <option value="">Select</option>
        <option value="1">Male</option>
        <option value="0">Female</option>
    </select>

    <label>Chest Pain Type</label>
    <select name="cp" required>
        <option value="">Select</option>
        <option value="0">Typical Angina</option>
        <option value="1">Atypical Angina</option>
        <option value="2">Non-anginal Pain</option>
        <option value="3">Asymptomatic</option>
    </select>

    <label>Resting Blood Pressure (80–200 mm Hg)</label>
    <input type="number" name="trestbps" min="80" max="200" required>

    <label>Cholesterol Level (100–600 mg/dl)</label>
    <input type="number" name="chol" min="100" max="600" required>

    <label>Fasting Blood Sugar > 120 mg/dl</label>
    <select name="fbs" required>
        <option value="">Select</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Resting ECG Result</label>
    <select name="restecg" required>
        <option value="">Select</option>
        <option value="0">Normal</option>
        <option value="1">ST-T Wave Abnormality</option>
        <option value="2">Left Ventricular Hypertrophy</option>
    </select>

    <label>Maximum Heart Rate Achieved (60–220)</label>
    <input type="number" name="thalach" min="60" max="220" required>

    <label>Exercise Induced Angina</label>
    <select name="exang" required>
        <option value="">Select</option>
        <option value="1">Yes</option>
        <option value="0">No</option>
    </select>

    <label>Oldpeak (ST Depression) (0.0 – 6.5)</label>
    <input type="number" step="0.1" name="oldpeak" min="0" max="6.5" required>

    <label>Slope of Peak Exercise ST Segment</label>
    <select name="slope" required>
        <option value="">Select</option>
        <option value="0">Upsloping</option>
        <option value="1">Flat</option>
        <option value="2">Downsloping</option>
    </select>

    <label>Number of Major Vessels (0–3)</label>
    <input type="number" name="ca" min="0" max="3" required>

    <label>Thalassemia</label>
    <select name="thal" required>
        <option value="">Select</option>
        <option value="1">Normal</option>
        <option value="2">Fixed Defect</option>
        <option value="3">Reversible Defect</option>
    </select>

    <button type="submit">🔍 Predict Heart Disease</button>
</form>

<hr>

<!-- ================= Delete Section ================= -->
<h3>🗑️ Delete Patient Record</h3>

<form action="/search_delete" method="post">

    <label>Patient Name</label>
    <input type="text" name="name" required>

    <label>Age</label>
    <input type="number" name="age" min="1" max="120" required>

    <button type="submit">Search Patient</button>
</form>

<hr>

<!-- ================= Dashboard Link ================= -->
<a href="/dashboard">
    <button class="dashboard-btn">📊 View Analytics Dashboard</button>
</a>
<hr>

<!-- ================= Retrain Model ================= -->
<a href="/retrain">
    <button style="background:#c62828;">🔄 Retrain ML Model</button>
</a>

</div>

</body>
</html>
