<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f1f8ff, #ffffff);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 480px;
            margin: 90px auto;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.18);
            text-align: center;
        }

        h2 {
            color: #0d47a1;
            margin-bottom: 20px;
        }

        .message {
            font-size: 15px;
            color: #616161;
            margin-bottom: 18px;
        }

        .positive {
            color: #c62828;
            font-size: 22px;
            font-weight: 700;
        }

        .negative {
            color: #2e7d32;
            font-size: 22px;
            font-weight: 700;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn:hover {
            background: #0d47a1;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🔍 Prediction Result</h2>

    <p class="message">{{ message }}</p>

    {% if "Detected" in result %}
        <div class="positive">❤️ {{ result }}</div>
    {% else %}
        <div class="negative">✅ {{ result }}</div>
    {% endif %}

    <a href="/" class="btn">⬅ Go Back</a>

</div>

</body>
</html>
